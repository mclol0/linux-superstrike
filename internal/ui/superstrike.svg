<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 470">
  <!-- Top-down mouse silhouette. Kept deliberately simple: this renders at
       ~64x96 in the dashboard header, where fine detail (contour lines, pulse
       rings, glows) collapses into noise. Shape only, one accent, no clutter. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#2A2F3D"/>
      <stop offset="0.45" stop-color="#1A1D26"/>
      <stop offset="1"    stop-color="#0E1016"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CC2FF"/>
      <stop offset="1" stop-color="#2E7FB8"/>
    </linearGradient>
    <!-- top-lit sheen, strongest across the button deck -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Body. Symmetric about x=170: rounded nose, widest just past mid-length,
       gently tapered tail. Control points are mirrored exactly (x' = 340 - x)
       so the two flanks can't drift apart. -->
  <path d="M170 16
           C212 16 240 56 246 112
           C252 172 258 240 264 302
           C270 372 240 456 170 456
           C100 456  70 372  76 302
           C 82 240  88 172  94 112
           C100 56  128 16  170 16 Z"
        fill="url(#shell)" stroke="url(#rim)" stroke-width="4"/>

  <!-- sheen clipped to the shell -->
  <path d="M170 16
           C212 16 240 56 246 112
           C252 172 258 240 264 302
           C270 372 240 456 170 456
           C100 456  70 372  76 302
           C 82 240  88 172  94 112
           C100 56  128 16  170 16 Z"
        fill="url(#sheen)"/>

  <!-- click split: stops where the button deck ends -->
  <path d="M170 24 L170 206" stroke="url(#rim)" stroke-width="3" stroke-opacity="0.7"/>

  <!-- scroll wheel -->
  <rect x="159" y="86" width="22" height="64" rx="11" fill="url(#rim)"/>
  <rect x="163.5" y="95" width="13" height="46" rx="6.5" fill="#0B0D12"/>
</svg>
