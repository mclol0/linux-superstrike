<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Neutral placeholder backdrop mark. This is deliberately NOT any vendor's
       trademark: drop your own logo at ~/.config/superstrike/logo.svg (or .png)
       and it replaces this at runtime. See backdrop.go. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CC2FF"/>
      <stop offset="1" stop-color="#2E7FB8"/>
    </linearGradient>
  </defs>

  <!-- concentric "strike" rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.55"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="7"  opacity="0.40"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#ring)" stroke-width="5"  opacity="0.28"/>

  <!-- bolt through the middle -->
  <path d="M286 96 L186 286 L246 286 L226 416 L336 216 L272 216 Z"
        fill="url(#ring)" opacity="0.75"/>
</svg>
